<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveKit E2EE Publisher</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 {
            color: #00d9ff;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 20px;
        }
        .config-section {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .config-section h3 {
            margin-top: 0;
            color: #00d9ff;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #0f0f23;
            color: #eee;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #00d9ff;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #00d9ff;
            color: #000;
        }
        .btn-primary:hover:not(:disabled) {
            background: #00b8d9;
        }
        .btn-danger {
            background: #ff4757;
            color: #fff;
        }
        .btn-danger:hover:not(:disabled) {
            background: #ff3344;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .status-section {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .status-indicator.disconnected { background: #666; }
        .status-indicator.connecting { background: #ffa500; animation: pulse 1s infinite; }
        .status-indicator.connected { background: #00ff88; }
        .status-indicator.error { background: #ff4757; }
        .status-indicator.enabled { background: #00ff88; }
        .status-indicator.disabled { background: #666; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .video-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }
        #localVideo {
            width: 100%;
            max-height: 500px;
            display: block;
        }
        .video-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        .log-section {
            background: #0f0f23;
            padding: 15px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
        }
        .log-entry {
            margin-bottom: 5px;
            padding: 3px 0;
            border-bottom: 1px solid #222;
        }
        .log-entry.info { color: #00d9ff; }
        .log-entry.success { color: #00ff88; }
        .log-entry.error { color: #ff4757; }
        .log-entry.warning { color: #ffa500; }
        .e2ee-badge {
            display: inline-block;
            background: #00ff88;
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 10px;
        }
        .e2ee-badge.disabled {
            background: #666;
            color: #ccc;
        }
    </style>
</head>
<body>
    <h1>LiveKit E2EE Publisher</h1>
    <p class="subtitle">Publish encrypted audio/video tracks to LiveKit</p>

    <div class="config-section">
        <h3>Connection Settings</h3>
        <div class="form-row">
            <div class="form-group">
                <label for="serverUrl">LiveKit Server URL</label>
                <input type="text" id="serverUrl" value="ws://localhost:7880" placeholder="ws://localhost:7880">
            </div>
            <div class="form-group">
                <label for="roomName">Room Name</label>
                <input type="text" id="roomName" value="publisher-hls-s3-room" placeholder="my-room">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="participantName">Participant Name</label>
                <input type="text" id="participantName" value="web-e2ee-publisher" placeholder="my-name">
            </div>
            <div class="form-group">
                <label for="apiKey">API Key</label>
                <input type="text" id="apiKey" value="devkey" placeholder="API Key">
            </div>
        </div>
        <div class="form-group">
            <label for="apiSecret">API Secret</label>
            <input type="password" id="apiSecret" value="secret" placeholder="API Secret">
        </div>
    </div>

    <div class="config-section">
        <h3>E2EE Settings <span id="e2eeBadge" class="e2ee-badge">ENABLED</span></h3>
        <div class="form-group">
            <label for="e2eePassphrase">E2EE Passphrase (shared secret)</label>
            <input type="text" id="e2eePassphrase" value="test-e2ee-secret-123" placeholder="Enter passphrase for E2EE">
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" id="e2eeEnabled" checked onchange="updateE2EEBadge()">
                Enable End-to-End Encryption
            </label>
        </div>
    </div>

    <div class="status-section">
        <h3>Status</h3>
        <div class="status-item">
            <div id="connectionIndicator" class="status-indicator disconnected"></div>
            <span id="connectionStatus">Disconnected</span>
        </div>
        <div class="status-item">
            <div id="e2eeIndicator" class="status-indicator disabled"></div>
            <span id="e2eeStatus">E2EE: Not active</span>
        </div>
        <div class="status-item">
            <div id="publishIndicator" class="status-indicator disabled"></div>
            <span id="publishStatus">Not publishing</span>
        </div>
    </div>

    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="video-overlay" id="videoOverlay">Local Preview</div>
    </div>

    <div class="button-group">
        <button id="connectBtn" class="btn-primary" onclick="connect()">Connect & Publish</button>
        <button id="disconnectBtn" class="btn-danger" onclick="disconnect()" disabled>Disconnect</button>
    </div>

    <h3 style="margin-top: 30px;">Event Log</h3>
    <div class="log-section" id="logSection"></div>

    <!-- LiveKit SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.js"></script>

    <script>
        // Globals
        let room = null;
        let localVideoTrack = null;
        let localAudioTrack = null;

        // Logging
        function log(message, type = 'info') {
            const logSection = document.getElementById('logSection');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logSection.appendChild(entry);
            logSection.scrollTop = logSection.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        // Update E2EE badge
        function updateE2EEBadge() {
            const badge = document.getElementById('e2eeBadge');
            const enabled = document.getElementById('e2eeEnabled').checked;
            badge.textContent = enabled ? 'ENABLED' : 'DISABLED';
            badge.className = enabled ? 'e2ee-badge' : 'e2ee-badge disabled';
        }

        // Update connection status
        function updateConnectionStatus(status) {
            const indicator = document.getElementById('connectionIndicator');
            const statusText = document.getElementById('connectionStatus');
            indicator.className = `status-indicator ${status}`;
            const statusMap = {
                'disconnected': 'Disconnected',
                'connecting': 'Connecting...',
                'connected': 'Connected',
                'error': 'Connection Error'
            };
            statusText.textContent = statusMap[status] || status;
        }

        // Update E2EE status
        function updateE2EEStatus(active, message) {
            const indicator = document.getElementById('e2eeIndicator');
            const statusText = document.getElementById('e2eeStatus');
            indicator.className = `status-indicator ${active ? 'enabled' : 'disabled'}`;
            statusText.textContent = message;
        }

        // Update publish status
        function updatePublishStatus(active, message) {
            const indicator = document.getElementById('publishIndicator');
            const statusText = document.getElementById('publishStatus');
            indicator.className = `status-indicator ${active ? 'enabled' : 'disabled'}`;
            statusText.textContent = message;
        }

        // Generate access token (client-side for demo purposes only!)
        // In production, tokens should be generated server-side
        async function generateToken(apiKey, apiSecret, roomName, participantName) {
            // Using the LiveKit server-sdk would be better, but for simplicity
            // we'll create a minimal JWT token client-side (NOT FOR PRODUCTION)

            // For local development, we can use the lk CLI or server to generate tokens
            // This is a workaround that creates a simple token structure

            const header = {
                alg: 'HS256',
                typ: 'JWT'
            };

            const now = Math.floor(Date.now() / 1000);
            const payload = {
                iss: apiKey,
                sub: participantName,
                nbf: now,
                exp: now + 86400, // 24 hours
                iat: now,
                jti: participantName + '-' + now,
                video: {
                    room: roomName,
                    roomJoin: true,
                    canPublish: true,
                    canSubscribe: true,
                    canPublishData: true
                }
            };

            // Base64URL encode
            function base64UrlEncode(obj) {
                const str = typeof obj === 'string' ? obj : JSON.stringify(obj);
                const base64 = btoa(str);
                return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            }

            // HMAC-SHA256 (using Web Crypto API)
            async function sign(data, secret) {
                const encoder = new TextEncoder();
                const key = await crypto.subtle.importKey(
                    'raw',
                    encoder.encode(secret),
                    { name: 'HMAC', hash: 'SHA-256' },
                    false,
                    ['sign']
                );
                const signature = await crypto.subtle.sign('HMAC', key, encoder.encode(data));
                return btoa(String.fromCharCode(...new Uint8Array(signature)))
                    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            }

            const headerB64 = base64UrlEncode(header);
            const payloadB64 = base64UrlEncode(payload);
            const signatureInput = `${headerB64}.${payloadB64}`;
            const signature = await sign(signatureInput, apiSecret);

            return `${headerB64}.${payloadB64}.${signature}`;
        }

        // Connect to LiveKit room
        async function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            const roomName = document.getElementById('roomName').value;
            const participantName = document.getElementById('participantName').value;
            const apiKey = document.getElementById('apiKey').value;
            const apiSecret = document.getElementById('apiSecret').value;
            const e2eeEnabled = document.getElementById('e2eeEnabled').checked;
            const e2eePassphrase = document.getElementById('e2eePassphrase').value;

            if (!serverUrl || !roomName || !participantName) {
                log('Please fill in all required fields', 'error');
                return;
            }

            if (e2eeEnabled && !e2eePassphrase) {
                log('E2EE is enabled but no passphrase provided', 'error');
                return;
            }

            try {
                updateConnectionStatus('connecting');
                document.getElementById('connectBtn').disabled = true;

                log('Generating access token...');
                const token = await generateToken(apiKey, apiSecret, roomName, participantName);
                log('Token generated successfully', 'success');

                // Create room options
                const roomOptions = {
                    adaptiveStream: true,
                    dynacast: true,
                    videoCaptureDefaults: {
                        resolution: { width: 1280, height: 720, frameRate: 30 }
                    },
                    audioCaptureDefaults: {
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                };

                // Add E2EE options if enabled
                if (e2eeEnabled) {
                    log('Configuring E2EE with passphrase...');
                    roomOptions.e2ee = {
                        keyProvider: new LivekitClient.ExternalE2EEKeyProvider(),
                        worker: new Worker(
                            new URL('https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.e2ee.worker.mjs', import.meta.url),
                            { type: 'module' }
                        )
                    };
                }

                // Create room
                log('Creating room instance...');
                room = new LivekitClient.Room(roomOptions);

                // Set up event handlers
                room.on(LivekitClient.RoomEvent.Connected, () => {
                    log('Connected to room!', 'success');
                    updateConnectionStatus('connected');
                });

                room.on(LivekitClient.RoomEvent.Disconnected, (reason) => {
                    log(`Disconnected from room: ${reason}`, 'warning');
                    updateConnectionStatus('disconnected');
                    cleanup();
                });

                room.on(LivekitClient.RoomEvent.LocalTrackPublished, (publication, participant) => {
                    log(`Published track: ${publication.trackName} (${publication.kind})`, 'success');
                    updatePublishStatus(true, `Publishing: video + audio`);
                });

                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    log(`Subscribed to track from ${participant.identity}: ${track.kind}`, 'info');
                });

                room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
                    log(`Participant joined: ${participant.identity}`, 'info');
                });

                room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
                    log(`Participant left: ${participant.identity}`, 'info');
                });

                room.on(LivekitClient.RoomEvent.EncryptionError, (error) => {
                    log(`Encryption error: ${error.message}`, 'error');
                });

                // Connect to room
                log(`Connecting to ${serverUrl}...`);
                await room.connect(serverUrl, token);
                log('Room connection established', 'success');

                // Set E2EE key if enabled
                if (e2eeEnabled && room.e2eeManager) {
                    log('Setting E2EE encryption key...');
                    const encoder = new TextEncoder();
                    const keyMaterial = encoder.encode(e2eePassphrase);

                    // Derive key using PBKDF2 (matching LiveKit's key derivation)
                    const baseKey = await crypto.subtle.importKey(
                        'raw',
                        keyMaterial,
                        'PBKDF2',
                        false,
                        ['deriveBits']
                    );

                    const salt = encoder.encode('LKFrameEncryptionKey');
                    const derivedBits = await crypto.subtle.deriveBits(
                        {
                            name: 'PBKDF2',
                            salt: salt,
                            iterations: 100000,
                            hash: 'SHA-256'
                        },
                        baseKey,
                        128 // 16 bytes
                    );

                    const derivedKey = new Uint8Array(derivedBits);

                    // Set the key on the key provider
                    await roomOptions.e2ee.keyProvider.setKey(derivedKey);
                    await room.setE2EEEnabled(true);

                    log('E2EE encryption key set successfully', 'success');
                    updateE2EEStatus(true, 'E2EE: Active (encrypted)');
                } else if (e2eeEnabled) {
                    log('E2EE manager not available', 'warning');
                    updateE2EEStatus(false, 'E2EE: Not available');
                } else {
                    updateE2EEStatus(false, 'E2EE: Disabled');
                }

                // Get local media and publish
                log('Requesting camera and microphone access...');

                // Create and publish video track
                localVideoTrack = await LivekitClient.createLocalVideoTrack({
                    resolution: { width: 1280, height: 720, frameRate: 30 }
                });

                // Show local preview
                const videoElement = document.getElementById('localVideo');
                localVideoTrack.attach(videoElement);
                log('Local video preview attached', 'success');

                // Create and publish audio track
                localAudioTrack = await LivekitClient.createLocalAudioTrack({
                    echoCancellation: true,
                    noiseSuppression: true
                });

                // Publish tracks
                log('Publishing video track...');
                await room.localParticipant.publishTrack(localVideoTrack, {
                    name: 'camera',
                    source: LivekitClient.Track.Source.Camera
                });

                log('Publishing audio track...');
                await room.localParticipant.publishTrack(localAudioTrack, {
                    name: 'microphone',
                    source: LivekitClient.Track.Source.Microphone
                });

                log('All tracks published successfully!', 'success');
                document.getElementById('disconnectBtn').disabled = false;

                // Update video overlay
                document.getElementById('videoOverlay').textContent =
                    `Publishing as: ${participantName} | Room: ${roomName}${e2eeEnabled ? ' | E2EE' : ''}`;

            } catch (error) {
                log(`Connection error: ${error.message}`, 'error');
                console.error(error);
                updateConnectionStatus('error');
                document.getElementById('connectBtn').disabled = false;
                cleanup();
            }
        }

        // Cleanup resources
        function cleanup() {
            if (localVideoTrack) {
                localVideoTrack.stop();
                localVideoTrack = null;
            }
            if (localAudioTrack) {
                localAudioTrack.stop();
                localAudioTrack = null;
            }
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            updatePublishStatus(false, 'Not publishing');
            document.getElementById('videoOverlay').textContent = 'Local Preview';
        }

        // Disconnect from room
        async function disconnect() {
            if (room) {
                log('Disconnecting from room...');
                await room.disconnect();
                room = null;
            }
            cleanup();
            updateConnectionStatus('disconnected');
            updateE2EEStatus(false, 'E2EE: Not active');
            log('Disconnected', 'info');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('LiveKit E2EE Publisher ready', 'info');
            log('Configure settings and click "Connect & Publish" to start', 'info');
        });
    </script>
</body>
</html>
