<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Player - LiveKit Egress Verification</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .player-container {
            padding: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .video-wrapper {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        video {
            width: 100%;
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .error {
            background: #fee;
            border-left-color: #e53e3e;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            border-left: 4px solid #e53e3e;
        }

        .error-message {
            color: #c53030;
            font-weight: 600;
        }

        .success {
            background: #f0fdf4;
            border-left-color: #10b981;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            border-left: 4px solid #10b981;
        }

        .success-message {
            color: #065f46;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .preset-urls {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .preset-urls h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .preset-link {
            display: block;
            padding: 8px;
            margin: 5px 0;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .preset-link:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 HLS Player</h1>
            <p>LiveKit Egress Verification Tool</p>
        </div>

        <div class="player-container">
            <div class="input-group">
                <label for="hlsUrl">HLS Stream URL (playlist.m3u8)</label>
                <div class="input-row">
                    <input type="text" id="hlsUrl" placeholder="http://localhost:9000/egress-test/session-123/playlist.m3u8">
                    <button class="btn" onclick="loadStream()">Load Stream</button>
                </div>
            </div>

            <div class="preset-urls">
                <h3>Quick Links</h3>
                <div class="preset-link" onclick="loadLocalFile()">
                    📁 Browse Local Files (from test output)
                </div>
                <div class="preset-link" onclick="loadPreset('http://localhost:9000/egress-test/')">
                    🗄️ MinIO - Browse Bucket (http://localhost:9000)
                </div>
            </div>

            <input type="file" id="fileInput" accept=".m3u8" style="display: none;" onchange="handleFileSelect(event)">

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading stream...</p>
            </div>

            <div id="errorContainer"></div>
            <div id="successContainer"></div>

            <div class="video-wrapper" id="videoWrapper" style="display: none;">
                <video id="video" controls autoplay muted></video>
            </div>

            <div class="controls" id="controls" style="display: none;">
                <button class="btn" onclick="video.play()">▶ Play</button>
                <button class="btn" onclick="video.pause()">⏸ Pause</button>
                <button class="btn" onclick="video.currentTime = 0">⏮ Restart</button>
                <button class="btn" onclick="video.muted = !video.muted">🔊 Toggle Mute</button>
                <button class="btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
            </div>

            <div class="stats" id="stats" style="display: none;">
                <div class="stat-card">
                    <div class="stat-label">Duration</div>
                    <div class="stat-value" id="duration">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Current Time</div>
                    <div class="stat-value" id="currentTime">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Buffered</div>
                    <div class="stat-value" id="buffered">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Quality</div>
                    <div class="stat-value" id="quality">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Bitrate</div>
                    <div class="stat-value" id="bitrate">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Dropped Frames</div>
                    <div class="stat-value" id="droppedFrames">--</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let hls = null;
        const video = document.getElementById('video');

        function showError(message) {
            const container = document.getElementById('errorContainer');
            container.innerHTML = `<div class="error"><div class="error-message">❌ ${message}</div></div>`;
            document.getElementById('loading').classList.remove('active');
        }

        function showSuccess(message) {
            const container = document.getElementById('successContainer');
            container.innerHTML = `<div class="success"><div class="success-message">✅ ${message}</div></div>`;
        }

        function clearMessages() {
            document.getElementById('errorContainer').innerHTML = '';
            document.getElementById('successContainer').innerHTML = '';
        }

        function loadPreset(url) {
            document.getElementById('hlsUrl').value = url;
            if (url.endsWith('/')) {
                showSuccess('Opening MinIO browser. Please copy a playlist.m3u8 URL and load it.');
                window.open(url, '_blank');
            } else {
                loadStream();
            }
        }

        function loadLocalFile() {
            document.getElementById('fileInput').click();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            clearMessages();
            showSuccess(`Selected: ${file.name}. Loading local playlist...`);

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const blob = new Blob([content], { type: 'application/vnd.apple.mpegurl' });
                const url = URL.createObjectURL(blob);

                // For local files, we need to load segments from the same directory
                // This requires the segments to be served via a local server
                showError('Local file playback requires a local HTTP server. Please use one of these options:\n\n' +
                    '1. Python: python3 -m http.server 8000\n' +
                    '2. Node: npx http-server -p 8000\n' +
                    '3. Go: go run tools/hls-player/server.go\n\n' +
                    'Then navigate to: http://localhost:8000/tools/hls-player/player.html?url=../../path/to/playlist.m3u8');
            };
            reader.readAsText(file);
        }

        function loadStream() {
            const url = document.getElementById('hlsUrl').value.trim();

            if (!url) {
                showError('Please enter a valid HLS URL');
                return;
            }

            clearMessages();
            document.getElementById('loading').classList.add('active');

            // Cleanup existing HLS instance
            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls({
                    debug: true,
                    enableWorker: true,
                    lowLatencyMode: false,
                });

                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    document.getElementById('loading').classList.remove('active');
                    document.getElementById('videoWrapper').style.display = 'block';
                    document.getElementById('controls').style.display = 'flex';
                    document.getElementById('stats').style.display = 'grid';
                    showSuccess('Stream loaded successfully!');
                    video.play();
                    startStatsUpdate();
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                showError(`Network error: ${data.details}. Check if the URL is accessible and CORS is configured.`);
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                showError(`Media error: ${data.details}. The stream may be corrupted.`);
                                hls.recoverMediaError();
                                break;
                            default:
                                showError(`Fatal error: ${data.details}`);
                                hls.destroy();
                                break;
                        }
                    } else {
                        console.warn('Non-fatal HLS error:', data);
                    }
                });

                hls.on(Hls.Events.LEVEL_LOADED, function(event, data) {
                    const level = hls.levels[data.level];
                    document.getElementById('quality').textContent =
                        `${level.width}x${level.height}`;
                    document.getElementById('bitrate').textContent =
                        `${(level.bitrate / 1000000).toFixed(2)} Mbps`;
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native HLS support (Safari)
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    document.getElementById('loading').classList.remove('active');
                    document.getElementById('videoWrapper').style.display = 'block';
                    document.getElementById('controls').style.display = 'flex';
                    document.getElementById('stats').style.display = 'grid';
                    showSuccess('Stream loaded successfully! (Native HLS)');
                    startStatsUpdate();
                });

                video.addEventListener('error', function() {
                    showError('Failed to load stream. Check the URL and CORS settings.');
                });
            } else {
                showError('HLS is not supported in this browser');
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '--';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function startStatsUpdate() {
            setInterval(() => {
                if (video) {
                    document.getElementById('duration').textContent = formatTime(video.duration);
                    document.getElementById('currentTime').textContent = formatTime(video.currentTime);

                    const buffered = video.buffered.length > 0 ?
                        formatTime(video.buffered.end(video.buffered.length - 1)) : '--';
                    document.getElementById('buffered').textContent = buffered;

                    if (video.getVideoPlaybackQuality) {
                        const quality = video.getVideoPlaybackQuality();
                        document.getElementById('droppedFrames').textContent = quality.droppedVideoFrames;
                    }
                }
            }, 1000);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                video.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Load from URL parameter if present
        const urlParams = new URLSearchParams(window.location.search);
        const streamUrl = urlParams.get('url');
        if (streamUrl) {
            document.getElementById('hlsUrl').value = streamUrl;
            loadStream();
        }
    </script>
</body>
</html>
